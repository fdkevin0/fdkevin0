name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          # Create a PAT secret named MY_PERSONAL_ACCESS_TOKEN to include
          # additional private-repository activity; otherwise this falls back
          # to the default workflow token.
          GITHUB_TOKEN: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Push SVGs to orphan output branch
        run: |
          remote_url="$(git config --get remote.origin.url)"
          auth_header="$(git config --get http.https://github.com/.extraheader)"
          tmpdir="$(mktemp -d)"
          cp -R profile-3d-contrib "$tmpdir/profile-3d-contrib"
          git -C "$tmpdir" init -b output
          git -C "$tmpdir" config user.name "github-actions[bot]"
          git -C "$tmpdir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmpdir" add profile-3d-contrib
          git -C "$tmpdir" commit -m "chore: update 3D contribution graphs"
          git -C "$tmpdir" -c "http.https://github.com/.extraheader=${auth_header}" push --force "$remote_url" output:refs/heads/output
